<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro Obras</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#EEF2EF; --surface:#FFFFFF; --ink:#17321D; --ink-soft:#56695C; --line:#D8E0DA;
    --accent:#1C9B3C; --accent-dark:#145A2A;
    --positive:#1C9B3C; --negative:#C1462B; --warn:#B8860B;
    --sidebar:#12261A; --sidebar-ink:#C7D3C9; --sidebar-ink-active:#FFFFFF;
    --logo-bg:#F7F7F7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:'Inter',sans-serif;background:var(--bg);}
  .fin-root{ font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; display:flex; -webkit-font-smoothing:antialiased; }
  .fin-display{font-family:'Oswald',sans-serif; letter-spacing:0.01em;}
  .fin-zigzag{ height:6px; width:100%;
    background-image: linear-gradient(135deg, var(--accent) 25%, transparent 25%), linear-gradient(225deg, var(--accent) 25%, transparent 25%);
    background-size: 12px 12px; background-repeat: repeat-x; opacity:0.9; }
  .fin-card{ background:var(--surface); border:1px solid var(--line); border-radius:6px; }
  .fin-btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:13px; border-radius:5px; padding:8px 14px;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:1px solid transparent; white-space:nowrap;
    transition:filter .12s ease, transform .05s ease; }
  .fin-btn:active{transform:translateY(1px);}
  .fin-btn:disabled{opacity:0.45; cursor:not-allowed;}
  .fin-btn-accent{background:var(--accent); color:#241703;}
  .fin-btn-accent:hover{filter:brightness(1.06);}
  .fin-btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
  .fin-btn-ghost:hover{background:#F3F4F5;}
  .fin-btn-danger{background:transparent; color:var(--negative); border:1px solid #EBC7BE;}
  .fin-btn-danger:hover{background:#FBEEEA;}
  .fin-btn-sm{padding:5px 9px; font-size:12px;}
  .fin-input{ font-family:'Inter',sans-serif; border:1px solid var(--line); border-radius:5px; padding:8px 10px;
    font-size:13px; width:100%; background:#FCFCFD; color:var(--ink); }
  .fin-input:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
  .fin-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:5px; display:block; }
  .fin-table{width:100%; border-collapse:collapse; font-size:13px;}
  .fin-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft);
    font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .fin-table td{padding:10px 12px; border-bottom:1px solid #EEF0F1; vertical-align:middle;}
  .fin-table tr:last-child td{border-bottom:none;}
  .fin-table tbody tr:hover{background:#F7F8F9;}
  .fin-nav-item{ display:flex; align-items:center; gap:10px; padding:10px 16px; color:var(--sidebar-ink);
    font-size:13px; font-weight:500; cursor:pointer; border-left:3px solid transparent; }
  .fin-nav-item:hover{background:rgba(255,255,255,0.04); color:var(--sidebar-ink-active);}
  .fin-nav-item.active{ background:rgba(226,154,46,0.12); color:var(--sidebar-ink-active); border-left:3px solid var(--accent); }
  .fin-pill{ font-size:12px; font-weight:600; padding:7px 13px; border-radius:99px; cursor:pointer; border:1px solid var(--line); color:var(--ink-soft); background:var(--surface); }
  .fin-pill.active{ background:var(--ink); color:white; border-color:var(--ink); }
  .fin-badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .fin-badge-ativa, .fin-badge-pago, .fin-badge-recebido{background:#E4F2EB; color:var(--positive);}
  .fin-badge-encerrada{background:#EDEEEF; color:var(--ink-soft);}
  .fin-badge-atrasado{background:#FBEEEA; color:var(--negative);}
  .fin-badge-pendente{background:#FCF3DF; color:var(--warn);}
  .fin-modal-backdrop{ position:fixed; inset:0; background:rgba(20,22,26,0.5); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; }
  .fin-modal{ background:var(--surface); border-radius:8px; width:100%; max-width:580px; box-shadow:0 20px 50px rgba(0,0,0,0.25); margin:0 auto; }
  @media print{
    .no-print{display:none !important;}
    body, .fin-root{background:white !important;}
    .fin-root{ --ink:#000000; --ink-soft:#222222; }
    .fin-table td, .fin-table th{ color:#000 !important; }
  }
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .login-card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:36px 32px; width:100%; max-width:360px; box-shadow:0 20px 50px rgba(0,0,0,0.08); }
</style>
</head>

function uid() { return Math.random().toString(36).slice(2, 10); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtBRL(v) { return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function fmtDate(d) { return d ? new Date(d + "T00:00:00").toLocaleDateString("pt-BR") : "—"; }
function ymOf(dateStr) {
  if (!dateStr) return [null, null];
  const parts = dateStr.split("-").map(Number);
  return [parts[0], parts[1] - 1];
}
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

const EMPTY_DATA = {
  empresa: { nome: "Tríade" },
  obras: [],
  fixos: [],
  fornecedores: [],
  clientes: [],
  contasPagar: [],
  contasReceber: [],
  extrato: [],
  ajustes: [],
  saldoInicial: { valor: 0, data: todayStr() },
  __v: 2,
};

function migrate(raw) {
  if (!raw) return JSON.parse(JSON.stringify(EMPTY_DATA));
  if (raw.__v === 2) {
    return Object.assign({}, EMPTY_DATA, raw, {
      empresa: { nome: (raw.empresa && raw.empresa.nome) || "Tríade" },
      fornecedores: raw.fornecedores || [],
      clientes: raw.clientes || [],
      contasPagar: raw.contasPagar || [],
      contasReceber: raw.contasReceber || [],
      extrato: raw.extrato || [],
      ajustes: raw.ajustes || [],
      saldoInicial: raw.saldoInicial || { valor: 0, data: todayStr() },
    });
  }
  const contasPagar = [];
  const contasReceber = [];
  (raw.despesas || []).forEach((d) => {
    contasPagar.push({
      id: d.id || uid(), descricao: d.descricao, categoria: d.categoria || "Escritório",
      centroCusto: "escritorio", fornecedor: "", valor: d.valor,
      dataVencimento: d.data, dataPagamento: d.data, formaPagamento: "", documentoRef: "",
      observacao: d.recorrente ? "Recorrente" : "",
    });
  });
  (raw.obras || []).forEach((o) => {
    (o.custos || []).forEach((c) => {
      contasPagar.push({
        id: c.id || uid(), descricao: c.descricao, categoria: c.categoria || "Obra",
        centroCusto: o.id, fornecedor: "", valor: c.valor,
        dataVencimento: c.data, dataPagamento: c.data, formaPagamento: "", documentoRef: "", observacao: "",
      });
    });
    (o.receitas || []).forEach((r) => {
      contasReceber.push({
        id: r.id || uid(), descricao: r.descricao, cliente: o.cliente || "", obraId: o.id,
        valor: r.valor, dataVencimento: r.data, dataRecebimento: r.data, formaPagamento: "", documentoRef: "", observacao: "",
      });
    });
    delete o.custos; delete o.receitas;
  });
  return Object.assign({}, EMPTY_DATA, raw, {
    empresa: { nome: (raw.empresa && raw.empresa.nome) || "Tríade" },
    contasPagar: contasPagar, contasReceber: contasReceber,
    fornecedores: raw.fornecedores || [], clientes: raw.clientes || [],
    extrato: raw.extrato || [], saldoInicial: raw.saldoInicial || { valor: 0, data: todayStr() }, __v: 2,
  });
}

const SUPABASE_URL = "COLOQUE_SUA_SUPABASE_URL_AQUI";
const SUPABASE_ANON_KEY = "COLOQUE_SUA_SUPABASE_ANON_KEY_AQUI";
const TABLE_NAME = "financeiro_dados";
const ROW_ID = "principal";

const SUPABASE_CONFIGURADO = SUPABASE_URL.indexOf("COLOQUE_") !== 0 && SUPABASE_ANON_KEY.indexOf("COLOQUE_") !== 0;
let sb = null;
if (SUPABASE_CONFIGURADO) {
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error("Erro ao criar cliente Supabase:", e); }
}

let AUTH_STATUS = "checking"; // checking | loggedOut | loggedIn | naoConfigurado
let AUTH_ERROR = "";
let SAVE_TIMER = null;

async function loadStateFromSupabase() {
  const { data, error } = await sb.from(TABLE_NAME).select("data").eq("id", ROW_ID).single();
  if (error) {
    console.error("Erro ao carregar dados:", error);
    return migrate(null);
  }
  return migrate(data ? data.data : null);
}

async function saveStateNow() {
  const ind = document.getElementById("save-indicator");
  try {
    const { error } = await sb.from(TABLE_NAME).update({ data: STATE, updated_at: new Date().toISOString() }).eq("id", ROW_ID);
    if (error) throw error;
    if (ind) ind.textContent = "Salvo " + new Date().toLocaleTimeString("pt-BR");
  } catch (e) {
    console.error(e);
    if (ind) ind.textContent = "Erro ao salvar (verifique sua internet)";
  }
}
function scheduleSave() {
  const ind = document.getElementById("save-indicator");
  if (ind) ind.textContent = "Salvando...";
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(saveStateNow, 500);
}

function getContaStatus(conta, tipo) {
  const paga = tipo === "pagar" ? conta.dataPagamento : conta.dataRecebimento;
  if (paga) return tipo === "pagar" ? "pago" : "recebido";
  if (conta.dataVencimento && conta.dataVencimento < todayStr()) return "atrasado";
  return "pendente";
}
function centroCustoOptions(data) {
  const opts = [
    { value: "escritorio", label: "Escritório" },
    { value: "folha", label: "Folha de Pagamento" },
  ];
  data.obras.forEach((o) => opts.push({ value: o.id, label: "Obra: " + o.nome }));
  return opts;
}
function centroCustoLabel(data, value) {
  const found = centroCustoOptions(data).find((c) => c.value === value);
  return found ? found.label : "—";
}
function statusLabel(status) {
  const map = { pago: "Pago", recebido: "Recebido", atrasado: "Atrasado", pendente: "Pendente", ativa: "Em andamento", encerrada: "Encerrada" };
  return map[status] || status;
}
function badge(status) {
  return '<span class="fin-badge fin-badge-' + status + '">' + statusLabel(status) + '</span>';
}

/* ================= Simple SVG charts (no external library) ================= */
function barChartSVG(categories, seriesA, seriesB, labelA, labelB, colorA, colorB) {
  const W = 720, H = 260, padL = 40, padB = 30, padT = 10, padR = 10;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxVal = Math.max(1, ...seriesA, ...seriesB);
  const n = categories.length;
  const groupW = chartW / n;
  const barW = groupW * 0.32;
  let bars = "";
  let gridlines = "";
  for (let g = 0; g <= 4; g++) {
    const y = padT + chartH - (g / 4) * chartH;
    gridlines += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#E7E9EB" stroke-width="1"/>';
    gridlines += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" font-size="10" fill="#5B6472" text-anchor="end">' + Math.round((maxVal * g / 4) / 1000) + 'k</text>';
  }
  categories.forEach((cat, i) => {
    const x0 = padL + i * groupW;
    const hA = (seriesA[i] / maxVal) * chartH;
    const hB = (seriesB[i] / maxVal) * chartH;
    const xA = x0 + groupW * 0.14;
    const xB = x0 + groupW * 0.54;
    bars += '<rect x="' + xA + '" y="' + (padT + chartH - hA) + '" width="' + barW + '" height="' + hA + '" fill="' + colorA + '" rx="2"><title>' + esc(cat) + " " + labelA + ": " + fmtBRL(seriesA[i]) + '</title></rect>';
    bars += '<rect x="' + xB + '" y="' + (padT + chartH - hB) + '" width="' + barW + '" height="' + hB + '" fill="' + colorB + '" rx="2"><title>' + esc(cat) + " " + labelB + ": " + fmtBRL(seriesB[i]) + '</title></rect>';
    bars += '<text x="' + (x0 + groupW / 2) + '" y="' + (H - padB + 16) + '" font-size="11" fill="#5B6472" text-anchor="middle">' + esc(cat) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:260px" xmlns="http://www.w3.org/2000/svg">' + gridlines + bars + '</svg>' +
    '<div style="display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-top:6px">' +
    '<span><span style="display:inline-block;width:10px;height:10px;background:' + colorA + ';border-radius:2px;margin-right:5px"></span>' + labelA + '</span>' +
    '<span><span style="display:inline-block;width:10px;height:10px;background:' + colorB + ';border-radius:2px;margin-right:5px"></span>' + labelB + '</span></div>';
}

function lineChartSVG(categories, series, label, color) {
  const W = 720, H = 240, padL = 46, padB = 26, padT = 10, padR = 10;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxVal = Math.max(1, ...series.map(Math.abs));
  const minVal = Math.min(0, ...series);
  const range = Math.max(1, maxVal - minVal);
  const n = categories.length;
  const stepX = chartW / (n - 1 || 1);
  let points = [];
  categories.forEach((cat, i) => {
    const x = padL + i * stepX;
    const y = padT + chartH - ((series[i] - minVal) / range) * chartH;
    points.push([x, y]);
  });
  const zeroY = padT + chartH - ((0 - minVal) / range) * chartH;
  let gridlines = '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (W - padR) + '" y2="' + zeroY + '" stroke="#DBDFE2" stroke-width="1" stroke-dasharray="3,3"/>';
  const pathD = points.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  let dots = "";
  points.forEach((p, i) => {
    dots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + color + '"><title>' + esc(categories[i]) + ": " + fmtBRL(series[i]) + '</title></circle>';
    dots += '<text x="' + p[0].toFixed(1) + '" y="' + (H - padB + 16) + '" font-size="11" fill="#5B6472" text-anchor="middle">' + esc(categories[i]) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:240px" xmlns="http://www.w3.org/2000/svg">' + gridlines +
    '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2.5"/>' + dots + '</svg>';
}

/* ================= Dashboard ================= */
function computeMonthlyRealized(data, year) {
  const receita = [], custo = [];
  for (let i = 0; i < 12; i++) {
    receita.push(data.contasReceber.filter((c) => { const ym = ymOf(c.dataRecebimento); return ym[0] === year && ym[1] === i; }).reduce((s, c) => s + (Number(c.valor) || 0), 0));
    custo.push(data.contasPagar.filter((c) => { const ym = ymOf(c.dataPagamento); return ym[0] === year && ym[1] === i; }).reduce((s, c) => s + (Number(c.valor) || 0), 0));
  }
  return { receita, custo };
}

function renderDashboard() {
  const year = UI.dashboardYear;
  const rc = computeMonthlyRealized(STATE, year);
  const yearTotals = { receita: rc.receita.reduce((a, b) => a + b, 0), custo: rc.custo.reduce((a, b) => a + b, 0) };
  const obrasAtivas = STATE.obras.filter((o) => o.status === "ativa").length;
  const nowMonth = new Date().getMonth(), nowYear = new Date().getFullYear();
  const rcNow = computeMonthlyRealized(STATE, nowYear);
  const recMes = rcNow.receita[nowMonth], custoMes = rcNow.custo[nowMonth];

  const proximos7 = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
  const vencendoPagar = STATE.contasPagar.filter((c) => !c.dataPagamento && c.dataVencimento >= todayStr() && c.dataVencimento <= proximos7);
  const atrasadasPagar = STATE.contasPagar.filter((c) => getContaStatus(c, "pagar") === "atrasado");
  const atrasadasReceber = STATE.contasReceber.filter((c) => getContaStatus(c, "receber") === "atrasado");

  let alertHtml = "";
  if (atrasadasPagar.length || atrasadasReceber.length || vencendoPagar.length) {
    let items = "";
    if (atrasadasPagar.length) items += "<li><strong style='color:var(--negative)'>" + atrasadasPagar.length + "</strong> conta(s) a pagar em atraso</li>";
    if (atrasadasReceber.length) items += "<li><strong style='color:var(--negative)'>" + atrasadasReceber.length + "</strong> conta(s) a receber em atraso</li>";
    if (vencendoPagar.length) items += "<li><strong>" + vencendoPagar.length + "</strong> conta(s) a pagar vencendo nos próximos 7 dias</li>";
    alertHtml = '<div class="fin-card" style="padding:14px 18px;margin-bottom:18px;border-left:4px solid var(--warn)">' +
      '<div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:6px">' + icon("alertTriangle", 16) + ' Alertas</div>' +
      '<ul style="margin:0;padding-left:20px;font-size:13px;color:var(--ink-soft)">' + items + '</ul></div>';
  }

  return alertHtml +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px">' +
    statCard("Recebido este mês", fmtBRL(recMes), "positive") +
    statCard("Pago este mês", fmtBRL(custoMes), "negative") +
    statCard("Resultado do mês", fmtBRL(recMes - custoMes), (recMes - custoMes) >= 0 ? "positive" : "negative") +
    statCard("Obras ativas", String(obrasAtivas), "neutral") +
    '</div>' +
    '<div class="fin-card" style="padding:20px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">' +
    '<h3 class="fin-display" style="font-size:17px;font-weight:600;margin:0">Receita vs. custo (realizado) — ' + year + '</h3>' +
    '<div style="display:flex;align-items:center;gap:8px">' +
    '<button class="fin-btn fin-btn-ghost fin-btn-sm" data-action="dash-year-prev">' + icon("chevronLeft", 14) + '</button>' +
    '<span style="font-size:13px;font-weight:600;width:40px;text-align:center">' + year + '</span>' +
    '<button class="fin-btn fin-btn-ghost fin-btn-sm" data-action="dash-year-next">' + icon("chevronRight", 14) + '</button></div></div>' +
    '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px">Total do ano: receita ' + fmtBRL(yearTotals.receita) + ' · custo ' + fmtBRL(yearTotals.custo) +
    ' · resultado <strong style="color:' + (yearTotals.receita - yearTotals.custo >= 0 ? "var(--positive)" : "var(--negative)") + '">' + fmtBRL(yearTotals.receita - yearTotals.custo) + '</strong></div>' +
    barChartSVG(MONTHS, rc.receita, rc.custo, "Receita", "Custo", "#2E7D5B", "#C1462B") +
    '</div>';
}

/* ================= Fluxo de Caixa ================= */
function renderFluxoCaixa() {
  const year = UI.fluxoYear;
  let saldo = Number(STATE.saldoInicial.valor) || 0;
  const siY = ymOf(STATE.saldoInicial.data)[0];
  const monthly = MONTHS.map((label, i) => {
    const entradas = STATE.contasReceber.filter((c) => { const ym = ymOf(c.dataRecebimento); return ym[0] === year && ym[1] === i; }).reduce((s, c) => s + (Number(c.valor) || 0), 0);
    const saidas = STATE.contasPagar.filter((c) => { const ym = ymOf(c.dataPagamento); return ym[0] === year && ym[1] === i; }).reduce((s, c) => s + (Number(c.valor) || 0), 0);
    const previstoEntrar = STATE.contasReceber.filter((c) => { const ym = ymOf(c.dataVencimento); return ym[0] === year && ym[1] === i && !c.dataRecebimento; }).reduce((s, c) => s + (Number(c.valor) || 0), 0);
    const previstoSair = STATE.contasPagar.filter((c) => { const ym = ymOf(c.dataVencimento); return ym[0] === year && ym[1] === i && !c.dataPagamento; }).reduce((s, c) => s + (Number(c.valor) || 0), 0);
    if (!(siY && siY > year)) saldo += entradas - saidas;
    return { mes: label, entradas: entradas, saidas: saidas, saldo: Math.round(saldo), previstoEntrar: previstoEntrar, previstoSair: previstoSair };
  });
  const totalEntradas = monthly.reduce((s, m) => s + m.entradas, 0);
  const totalSaidas = monthly.reduce((s, m) => s + m.saidas, 0);

  const tableRows = monthly.map((m) => '<tr><td style="font-weight:600">' + m.mes + '</td>' +
    '<td style="color:var(--positive)">' + fmtBRL(m.entradas) + '</td><td style="color:var(--negative)">' + fmtBRL(m.saidas) + '</td>' +
    '<td style="color:var(--ink-soft)">' + fmtBRL(m.previstoEntrar) + '</td><td style="color:var(--ink-soft)">' + fmtBRL(m.previstoSair) + '</td>' +
    '<td style="font-weight:700">' + fmtBRL(m.saldo) + '</td></tr>').join("");

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
    '<div style="font-size:13px;color:var(--ink-soft)">Saldo inicial considerado: <strong>' + fmtBRL(STATE.saldoInicial.valor) + '</strong> em ' + fmtDate(STATE.saldoInicial.data) +
    ' <button class="fin-btn fin-btn-ghost fin-btn-sm" style="margin-left:8px" data-action="open-modal-saldo-inicial">editar</button></div>' +
    '<div style="display:flex;align-items:center;gap:8px">' +
    '<button class="fin-btn fin-btn-ghost fin-btn-sm" data-action="fluxo-year-prev">' + icon("chevronLeft", 14) + '</button>' +
    '<span style="font-size:13px;font-weight:600;width:40px;text-align:center">' + year + '</span>' +
    '<button class="fin-btn fin-btn-ghost fin-btn-sm" data-action="fluxo-year-next">' + icon("chevronRight", 14) + '</button></div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px">' +
    statCard("Entradas no ano", fmtBRL(totalEntradas), "positive") +
    statCard("Saídas no ano", fmtBRL(totalSaidas), "negative") +
    statCard("Saldo projetado (dez)", fmtBRL(monthly[11].saldo), monthly[11].saldo >= 0 ? "positive" : "negative") + '</div>' +
    '<div class="fin-card" style="padding:20px;margin-bottom:18px">' + lineChartSVG(MONTHS, monthly.map((m) => m.saldo), "Saldo", "#1B2027") + '</div>' +
    '<div class="fin-card"><table class="fin-table"><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Previsto a entrar</th><th>Previsto a sair</th><th>Saldo acumulado</th></tr></thead><tbody>' + tableRows + '</tbody></table></div>';
}

function parseCsvSimple(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map((h) => h.trim().toLowerCase());
  return lines.slice(1).map((line) => {
    const cols = line.split(",");
    const row = {};
    headers.forEach((h, i) => { row[h] = (cols[i] || "").trim(); });
    return row;
  });
}

function handleCsvImport(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const rows = parseCsvSimple(e.target.result);
    const novas = rows.map((row) => {
      const valorNum = Number((row.valor || "0").replace(",", "."));
      return {
        id: uid(), data: row.data || todayStr(), descricao: row.descricao || row["descrição"] || "",
        valor: Math.abs(valorNum), tipo: (valorNum < 0 || /d[ée]bito|sa[ií]da/i.test(row.tipo || "")) ? "saida" : "entrada",
        conciliadoId: null, conciliadoTipo: null,
      };
    });
    setState((s) => { s.extrato = s.extrato.concat(novas); });
  };
  reader.readAsText(file);
}

/* ================= Folha de Pagamento ================= */
function computeFolhaLinhas(month, year) {
  const linhas = [];
  STATE.fixos.forEach((f) => {
    if (!f.ativo) return;
    linhas.push({ nome: f.nome, origem: "Escritório", cargo: f.cargo || "—", valor: Number(f.salario) || 0, transporte: 0, outros: 0 });
    (f.custosAdicionais || []).forEach((c) => {
      linhas.push({ nome: f.nome, origem: "Escritório", cargo: c.descricao, valor: 0, transporte: 0, outros: Number(c.valor) || 0 });
    });
  });
  STATE.obras.forEach((obra) => {
    if (obra.status === "encerrada") {
      const ym = ymOf(obra.dataEncerramento);
      if (!(ym[0] === year && ym[1] === month)) return;
    }
    (obra.funcionarios || []).forEach((f) => {
      if (!f.ativo) return;
      const base = f.tipoValor === "semanal" ? (Number(f.valor) || 0) * 4.345 : (Number(f.valor) || 0);
      linhas.push({ nome: f.nome, origem: obra.nome, cargo: f.tipoValor === "semanal" ? "Semanal (conv. mensal)" : "Mensal", valor: base, transporte: Number(f.transporte) || 0, outros: Number(f.outros) || 0 });
    });
  });
  const competencia = year + "-" + String(month + 1).padStart(2, "0");
  (STATE.ajustes || []).forEach((a) => {
    if (a.competencia !== competencia) return;
    const valorAssinado = a.sinal === "debito" ? -Math.abs(Number(a.valor) || 0) : Math.abs(Number(a.valor) || 0);
    linhas.push({ nome: a.funcionarioNome, origem: centroCustoLabel(STATE, a.centroCusto), cargo: a.tipo + (a.descricao ? " — " + a.descricao : ""), valor: valorAssinado, transporte: 0, outros: 0, ajuste: true });
  });
  return linhas;
}
function listaFuncionariosParaAjuste() {
  const opts = [];
  STATE.fixos.forEach((f) => { if (f.ativo) opts.push({ value: "escritorio||" + f.nome, label: f.nome + " — Escritório" }); });
  STATE.obras.forEach((obra) => {
    (obra.funcionarios || []).forEach((f) => { if (f.ativo) opts.push({ value: obra.id + "||" + f.nome, label: f.nome + " — Obra: " + obra.nome }); });
  });
  return opts;
}

function computeFolhaObraTotal(month, year) {
  let total = 0;
  STATE.obras.forEach((obra) => {
    if (obra.status === "encerrada") {
      const ym = ymOf(obra.dataEncerramento);
      if (!(ym[0] === year && ym[1] === month)) return;
    }
    (obra.funcionarios || []).forEach((f) => {
      if (!f.ativo) return;
      const base = f.tipoValor === "semanal" ? (Number(f.valor) || 0) * 4.345 : (Number(f.valor) || 0);
      total += base + (Number(f.transporte) || 0) + (Number(f.outros) || 0);
    });
  });
  return total;
}

/* ================= Geração automática de recorrentes (Equipe Fixa) ================= */
function ensureRecorrentesDoMes() {
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const competencia = year + "-" + String(month + 1).padStart(2, "0");
  const diaVencimento = "-05";
  let mudou = false;
  STATE.fixos.forEach((f) => {
    if (!f.ativo) return;
    const jaTemSalario = STATE.contasPagar.some((c) => c.origemFixoId === f.id && c.origemTipo === "salario" && c.competencia === competencia);
    if (!jaTemSalario && Number(f.salario) > 0) {
      STATE.contasPagar.push({
        id: uid(), descricao: "Salário — " + f.nome + " (" + MONTHS_FULL[month] + "/" + year + ")", categoria: "Salário",
        centroCusto: "escritorio", fornecedor: "", valor: f.salario, dataVencimento: competencia + diaVencimento,
        dataPagamento: null, formaPagamento: "", documentoRef: "", recorrente: true, competencia: competencia,
        origemFixoId: f.id, origemTipo: "salario",
      });
      mudou = true;
    }
    (f.custosAdicionais || []).forEach((c) => {
      const jaTem = STATE.contasPagar.some((cp) => cp.origemFixoId === f.id && cp.origemTipo === c.id && cp.competencia === competencia);
      if (!jaTem && Number(c.valor) > 0) {
        STATE.contasPagar.push({
          id: uid(), descricao: c.descricao + " — " + f.nome + " (" + MONTHS_FULL[month] + "/" + year + ")", categoria: c.descricao,

          origemFixoId: f.id, origemTipo: c.id,
        });
        mudou = true;
      }
    });
  });
  return mudou;
}

/* ================= Relatórios ================= */
function relatorioRows(tipo, year) {
  if (tipo === "pagar") {
    return STATE.contasPagar.filter((c) => ymOf(c.dataVencimento)[0] === year).map((c) => ({
      "Descrição": c.descricao, "Centro de custo": centroCustoLabel(STATE, c.centroCusto), "Fornecedor": c.fornecedor || "",
      "Vencimento": fmtDate(c.dataVencimento), "Pagamento": c.dataPagamento ? fmtDate(c.dataPagamento) : "", "Valor": Number(c.valor) || 0, "Status": statusLabel(getContaStatus(c, "pagar")),
    }));
  }
  if (tipo === "receber") {
    return STATE.contasReceber.filter((c) => ymOf(c.dataVencimento)[0] === year).map((c) => ({
      "Descrição": c.descricao, "Cliente": c.cliente || "", "Obra": c.obraId ? ((STATE.obras.find((o) => o.id === c.obraId) || {}).nome || "") : "",
      "Vencimento": fmtDate(c.dataVencimento), "Recebimento": c.dataRecebimento ? fmtDate(c.dataRecebimento) : "", "Valor": Number(c.valor) || 0, "Status": statusLabel(getContaStatus(c, "receber")),
    }));
  }
  return MONTHS.map((label, i) => {
    const entradas = STATE.contasReceber.filter((c) => { const ym = ymOf(c.dataRecebimento); return ym[0] === year && ym[1] === i; }).reduce((s, c) => s + (Number(c.valor) || 0), 0);
    const saidas = STATE.contasPagar.filter((c) => { const ym = ymOf(c.dataPagamento); return ym[0] === year && ym[1] === i; }).reduce((s, c) => s + (Number(c.valor) || 0), 0);
    return { "Mês": label, "Entradas": entradas, "Saídas": saidas, "Resultado": entradas - saidas };
  });
}

function exportarCSV() {
  const rows = relatorioRows(UI.relTipo, UI.relYear);
  if (rows.length === 0) return;
  const cols = Object.keys(rows[0]);
  const csvLines = [cols.join(";")];
  rows.forEach((r) => { csvLines.push(cols.map((c) => String(r[c]).replace(/;/g, ",")).join(";")); });
  const blob = new Blob(["\uFEFF" + csvLines.join("\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "relatorio-" + UI.relTipo + "-" + UI.relYear + ".csv"; a.click();
  URL.revokeObjectURL(url);
}

function exportarBackup() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const carimbo = todayStr();
  a.href = url; a.download = "backup-financeiro-triade-" + carimbo + ".json"; a.click();
  URL.revokeObjectURL(url);
}
function handleImportarBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    let parsed;
    try {
      parsed = JSON.parse(e.target.result);
    } catch (err) {
      alert("Arquivo inválido. Selecione um backup em .json exportado por este sistema.");
      input.value = "";
      return;
    }
    const ok = confirm("Importar este backup vai SUBSTITUIR todos os dados atuais salvos no Supabase (para todos que usam este login). Deseja continuar?");
    if (!ok) { input.value = ""; return; }
    STATE = migrate(parsed);
    ensureRecorrentesDoMes();
    saveStateNow();
    render();
    input.value = "";
  };
  reader.readAsText(file);
}

/* ================= Dispatch ================= */
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }

function handleClick(action, el) {
  const id = el.getAttribute("data-id");
  const tipo = el.getAttribute("data-tipo");

  if (action === "tab") { UI.tab = id; UI.obraSelecionada = null; render(); return; }
  if (action === "close-modal") { closeModal(); return; }

  if (action === "obra-open") { UI.obraSelecionada = id; render(); return; }
  if (action === "obra-back") { UI.obraSelecionada = null; render(); return; }
  if (action === "open-modal-nova-obra") { UI.modal = { type: "nova-obra" }; render(); return; }
  if (action === "submit-obra") {
    const nome = val("f-nome");
    if (!nome) return;
    setState((s) => { s.obras.push({ id: uid(), status: "ativa", funcionarios: [], nome: nome, cliente: val("f-cliente"), valorContrato: val("f-valorContrato"), local: val("f-local"), dataInicio: val("f-dataInicio") }); });
    UI.modal = null; render(); return;
  }
  if (action === "open-modal-encerrar-obra") { UI.modal = { type: "encerrar-obra" }; render(); return; }
  if (action === "submit-encerrar-obra") {
    const obraId = UI.obraSelecionada;
    setState((s) => { s.obras = s.obras.map((o) => o.id === obraId ? Object.assign({}, o, { status: "encerrada", dataEncerramento: todayStr() }) : o); });
    UI.modal = null; render(); return;
  }
  if (action === "reabrir-obra") {
    const obraId = UI.obraSelecionada;
    setState((s) => { s.obras = s.obras.map((o) => o.id === obraId ? Object.assign({}, o, { status: "ativa", dataEncerramento: null }) : o); });
    return;
  }
  if (action === "open-modal-funcionario-obra") { UI.modal = { type: "funcionario-obra" }; render(); return; }
  if (action === "submit-funcionario-obra") {
    const nome = val("f-nome"); if (!nome) return;
    const obraId = UI.obraSelecionada;
    setState((s) => { s.obras = s.obras.map((o) => o.id === obraId ? Object.assign({}, o, { funcionarios: (o.funcionarios || []).concat([{ id: uid(), ativo: true, nome: nome, tipoValor: val("f-tipoValor"), valor: val("f-valor"), transporte: val("f-transporte"), outros: val("f-outros") }]) }) : o); });
    UI.modal = null; render(); return;
  }
  if (action === "toggle-funcionario-obra") {
    const obraId = UI.obraSelecionada;
    setState((s) => { s.obras = s.obras.map((o) => o.id === obraId ? Object.assign({}, o, { funcionarios: o.funcionarios.map((f) => f.id === id ? Object.assign({}, f, { ativo: !f.ativo }) : f) }) : o); });
    return;
  }
  if (action === "remove-funcionario-obra") {
    const obraId = UI.obraSelecionada;
    setState((s) => { s.obras = s.obras.map((o) => o.id === obraId ? Object.assign({}, o, { funcionarios: o.funcionarios.filter((f) => f.id !== id) }) : o); });
    return;
  }

  if (action === "open-modal-pagar-obra") { UI.modal = { type: "conta-pagar", defaultCentro: UI.obraSelecionada, editObraId: UI.obraSelecionada }; render(); return; }
  if (action === "open-modal-receber-obra") { UI.modal = { type: "conta-receber", defaultObraId: UI.obraSelecionada }; render(); return; }
  if (action === "open-modal-nova-conta-pagar") { UI.modal = { type: "conta-pagar" }; render(); return; }
  if (action === "open-modal-nova-conta-receber") { UI.modal = { type: "conta-receber" }; render(); return; }
  if (action === "submit-conta-pagar") {
    const descricao = val("f-descricao"), valor = val("f-valor");
    if (!descricao || !valor) return;
    setState((s) => { s.contasPagar.push({ id: uid(), descricao: descricao, categoria: val("f-categoria"), centroCusto: val("f-centroCusto"), fornecedor: val("f-fornecedor"), valor: valor, dataVencimento: val("f-dataVencimento"), dataPagamento: null, formaPagamento: val("f-formaPagamento"), documentoRef: val("f-documentoRef") }); });
    UI.modal = null; render(); return;
  }
  if (action === "submit-conta-receber") {
    const descricao = val("f-descricao"), valor = val("f-valor");
    if (!descricao || !valor) return;
    setState((s) => { s.contasReceber.push({ id: uid(), descricao: descricao, cliente: val("f-cliente"), obraId: val("f-obraId") || null, valor: valor, dataVencimento: val("f-dataVencimento"), dataRecebimento: null, formaPagamento: val("f-formaPagamento"), documentoRef: val("f-documentoRef") }); });
    UI.modal = null; render(); return;
  }
  if (action === "open-modal-baixa-pagar") { UI.modal = { type: "baixa", tipo: "pagar", contaId: id }; render(); return; }
  if (action === "open-modal-baixa-receber") { UI.modal = { type: "baixa", tipo: "receber", contaId: id }; render(); return; }
  if (action === "submit-baixa") {
    const dataBaixa = val("f-dataBaixa");
    const m = UI.modal;
    setState((s) => {
      if (m.tipo === "pagar") s.contasPagar = s.contasPagar.map((c) => c.id === m.contaId ? Object.assign({}, c, { dataPagamento: dataBaixa }) : c);
      else s.contasReceber = s.contasReceber.map((c) => c.id === m.contaId ? Object.assign({}, c, { dataRecebimento: dataBaixa }) : c);
    });
    UI.modal = null; render(); return;
  }
  if (action === "estornar-pagar") { setState((s) => { s.contasPagar = s.contasPagar.map((c) => c.id === id ? Object.assign({}, c, { dataPagamento: null }) : c); }); return; }
  if (action === "estornar-receber") { setState((s) => { s.contasReceber = s.contasReceber.map((c) => c.id === id ? Object.assign({}, c, { dataRecebimento: null }) : c); }); return; }
  if (action === "remove-pagar") { setState((s) => { s.contasPagar = s.contasPagar.filter((c) => c.id !== id); }); return; }
  if (action === "remove-receber") { setState((s) => { s.contasReceber = s.contasReceber.filter((c) => c.id !== id); }); return; }

  if (action === "open-modal-novo-fixo") { UI.modal = { type: "novo-fixo" }; render(); return; }
  if (action === "submit-fixo") {
    const nome = val("f-nome"); if (!nome) return;
    setState((s) => { s.fixos.push({ id: uid(), ativo: true, nome: nome, cargo: val("f-cargo"), salario: val("f-salario"), dataInicio: val("f-dataInicio"), custosAdicionais: [] }); });
    UI.modal = null; render(); return;
  }
  if (action === "toggle-fixo") { setState((s) => { s.fixos = s.fixos.map((f) => f.id === id ? Object.assign({}, f, { ativo: !f.ativo }) : f); }); return; }
  if (action === "remove-fixo") { setState((s) => { s.fixos = s.fixos.filter((f) => f.id !== id); }); return; }
  if (action === "open-modal-custos-fixo") { UI.modal = { type: "custos-fixo", fixoId: id }; render(); return; }
  if (action === "submit-custo-fixo") {
    const descricao = val("f-custoDescricao"), valor = val("f-custoValor"); if (!descricao || !valor) return;
    const fixoId = UI.modal.fixoId;
    setState((s) => { s.fixos = s.fixos.map((f) => f.id === fixoId ? Object.assign({}, f, { custosAdicionais: (f.custosAdicionais || []).concat([{ id: uid(), descricao: descricao, valor: valor }]) }) : f); });
    render(); return;
  }
  if (action === "remove-custo-fixo") {
    const fixoId = UI.modal.fixoId;
    setState((s) => { s.fixos = s.fixos.map((f) => f.id === fixoId ? Object.assign({}, f, { custosAdicionais: (f.custosAdicionais || []).filter((c) => c.id !== id) }) : f); });
    render(); return;
  }

  if (action === "open-modal-saldo-inicial") { UI.modal = { type: "saldo-inicial" }; render(); return; }
  if (action === "submit-saldo-inicial") {
    setState((s) => { s.saldoInicial = { valor: val("f-saldoValor"), data: val("f-saldoData") }; });
    UI.modal = null; render(); return;
  }
  if (action === "dash-year-prev") { UI.dashboardYear -= 1; render(); return; }
  if (action === "dash-year-next") { UI.dashboardYear += 1; render(); return; }
  if (action === "fluxo-year-prev") { UI.fluxoYear -= 1; render(); return; }
  if (action === "fluxo-year-next") { UI.fluxoYear += 1; render(); return; }

  if (action === "open-modal-extrato") { UI.modal = { type: "extrato" }; render(); return; }
  if (action === "submit-extrato") {
    const descricao = val("f-descricao"), valor = val("f-valor"); if (!descricao || !valor) return;
    setState((s) => { s.extrato.push({ id: uid(), data: val("f-data"), descricao: descricao, valor: Math.abs(Number(valor)), tipo: val("f-tipo"), conciliadoId: null, conciliadoTipo: null }); });
    UI.modal = null; render(); return;
  }
  if (action === "remove-extrato") { setState((s) => { s.extrato = s.extrato.filter((e) => e.id !== id); }); return; }

  if (action === "open-modal-cadastro") { UI.modal = { type: "cadastro", tipo: tipo }; render(); return; }
  if (action === "submit-fornecedor" || action === "submit-cliente") {
    const nome = val("f-nome"); if (!nome) return;
    const key = action === "submit-fornecedor" ? "fornecedores" : "clientes";
    setState((s) => { s[key].push({ id: uid(), nome: nome, contato: val("f-contato"), documento: val("f-documento") }); });
    UI.modal = null; render(); return;
  }
  if (action === "remove-cadastro") {
    const key = tipo === "fornecedor" ? "fornecedores" : "clientes";
    setState((s) => { s[key] = s[key].filter((i) => i.id !== id); }); return;
  }

  if (action === "fin-sub") { UI.finSub = id; render(); return; }

  if (action === "open-modal-lancar-folha") {
    const total = computeFolhaObraTotal(UI.folhaMonth, UI.folhaYear);
    UI.modal = { type: "lancar-folha", total: total, mes: UI.folhaMonth, ano: UI.folhaYear };
    render(); return;
  }
  if (action === "submit-lancar-folha") {
    const m = UI.modal;
    const competencia = m.ano + "-" + String(m.mes + 1).padStart(2, "0");
    setState((s) => {
      s.contasPagar.push({ id: uid(), descricao: "Folha de obras — " + MONTHS_FULL[m.mes] + "/" + m.ano, categoria: "Folha", centroCusto: "folha", fornecedor: "", valor: m.total, dataVencimento: val("f-vencimentoFolha"), dataPagamento: null, formaPagamento: "", documentoRef: "", competencia: competencia });
    });
    UI.modal = null; render(); return;
  }

  if (action === "open-modal-ajuste") { UI.modal = { type: "ajuste", mes: UI.folhaMonth, ano: UI.folhaYear }; render(); return; }
  if (action === "submit-ajuste") {
    const funcVal = val("f-ajusteFuncionario");
    const valor = val("f-ajusteValor");
    if (!funcVal || !valor) return;
    const parts = funcVal.split("||");
    const centroCusto = parts[0], funcionarioNome = parts.slice(1).join("||");
    const tipo = val("f-ajusteTipo"), sinal = val("f-ajusteSinal"), descricao = val("f-ajusteDescricao");
    const mes = Number(val("f-ajusteMes")), ano = Number(val("f-ajusteAno"));
    const competencia = ano + "-" + String(mes + 1).padStart(2, "0");
    const ajusteId = uid();
    const valorAbs = Math.abs(Number(valor) || 0);
    const valorAssinado = sinal === "debito" ? -valorAbs : valorAbs;
    setState((s) => {
      s.ajustes.push({ id: ajusteId, funcionarioNome: funcionarioNome, centroCusto: centroCusto, competencia: competencia, tipo: tipo, descricao: descricao, valor: valorAbs, sinal: sinal });
      s.contasPagar.push({
        id: uid(), descricao: tipo + " — " + funcionarioNome + " (" + MONTHS_FULL[mes] + "/" + ano + ")" + (descricao ? " — " + descricao : ""),
        categoria: tipo, centroCusto: centroCusto, fornecedor: "", valor: valorAssinado, dataVencimento: competencia + "-05",
        dataPagamento: null, formaPagamento: "", documentoRef: "", competencia: competencia, origemAjusteId: ajusteId,
      });
    });
    UI.modal = null; render(); return;
  }
  if (action === "remove-ajuste") {
    setState((s) => {
      s.ajustes = s.ajustes.filter((a) => a.id !== id);
      s.contasPagar = s.contasPagar.filter((c) => c.origemAjusteId !== id);
    });
    return;
  }

  if (action === "exportar-csv") { exportarCSV(); return; }
  if (action === "exportar-backup") { exportarBackup(); return; }

  if (action === "open-modal-empresa") { UI.modal = { type: "empresa" }; render(); return; }
  if (action === "submit-empresa") {
    setState((s) => { s.empresa = { nome: val("f-empresaNome") }; });
    UI.modal = null; render(); return;
  }

  if (action === "submit-login") {
    const email = val("f-loginEmail"), senha = val("f-loginSenha");
    if (!email || !senha) return;
    const btn = document.getElementById("login-submit-btn");
    if (btn) { btn.disabled = true; btn.textContent = "Entrando..."; }
    sb.auth.signInWithPassword({ email: email, password: senha }).then(({ error }) => {
      if (error) {
        AUTH_ERROR = "E-mail ou senha inválidos.";
        render();
      }
      // sucesso: onAuthStateChange cuida de carregar os dados e re-renderizar
    });
    return;
  }
  if (action === "logout") {
    sb.auth.signOut().then(() => {
      STATE = null;
      AUTH_STATUS = "loggedOut";
      render();
    });
    return;
  }
}

function handleChange(action, el) {
  const value = el.value;
  const id = el.getAttribute("data-id");
  const tipoAttr = el.getAttribute("data-tipo");
  if (action === "pagar-filtro-status") { UI.pagarStatus = value; render(); return; }
  if (action === "pagar-filtro-centro") { UI.pagarCentro = value; render(); return; }
  if (action === "receber-filtro-status") { UI.receberStatus = value; render(); return; }
  if (action === "folha-month") { UI.folhaMonth = Number(value); render(); return; }
  if (action === "folha-year") { UI.folhaYear = Number(value); render(); return; }
  if (action === "rel-tipo") { UI.relTipo = value; render(); return; }
  if (action === "rel-year") { UI.relYear = Number(value); render(); return; }
  if (action === "conciliar") {
    const linhaId = id, tipo = tipoAttr, contaId = value || null;
    setState((s) => {
      s.extrato = s.extrato.map((e) => e.id === linhaId ? Object.assign({}, e, { conciliadoId: contaId, conciliadoTipo: contaId ? tipo : null }) : e);
      const linha = s.extrato.find((e) => e.id === linhaId);
      if (contaId && tipo === "pagar") s.contasPagar = s.contasPagar.map((c) => c.id === contaId ? Object.assign({}, c, { dataPagamento: linha.data }) : c);
      if (contaId && tipo === "receber") s.contasReceber = s.contasReceber.map((c) => c.id === contaId ? Object.assign({}, c, { dataRecebimento: linha.data }) : c);
    });
    return;
  }
}

document.addEventListener("click", function (e) {
  const modalBackdrop = e.target.closest && e.target.closest(".fin-modal-backdrop");
  if (modalBackdrop && e.target === modalBackdrop) { closeModal(); return; }
  const actionEl = e.target.closest && e.target.closest("[data-action]");
  if (!actionEl) return;
  const action = actionEl.getAttribute("data-action");
  if (action === "modal-backdrop-click") return;
  handleClick(action, actionEl);
});
document.addEventListener("change", function (e) {
  const el = e.target.closest && e.target.closest("[data-onchange]");
  if (!el) return;
  handleChange(el.getAttribute("data-onchange"), el);
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && AUTH_STATUS === "loggedOut") {
    const active = document.activeElement;
    if (active && (active.id === "f-loginEmail" || active.id === "f-loginSenha")) {
      handleClick("submit-login", active);
    }
  }
});

async function bootstrapAuth() {
  if (!SUPABASE_CONFIGURADO || !sb) {
    AUTH_STATUS = "naoConfigurado";
    render();
    return;
  }

  const { data } = await sb.auth.getSession();
  if (data && data.session) {
    AUTH_STATUS = "loggedIn";
    render();
    STATE = await loadStateFromSupabase();
    if (ensureRecorrentesDoMes()) { saveStateNow(); }
    render();
  } else {
    AUTH_STATUS = "loggedOut";
    render();
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === "SIGNED_IN" && AUTH_STATUS !== "loggedIn") {
      AUTH_STATUS = "loggedIn";
      AUTH_ERROR = "";
      render();
      STATE = await loadStateFromSupabase();
      if (ensureRecorrentesDoMes()) { saveStateNow(); }
      render();
    } else if (event === "SIGNED_OUT") {
      AUTH_STATUS = "loggedOut";
      STATE = null;
      render();
    }
  });
}

render();
bootstrapAuth();
</script>
</body>
</html>
